[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "ripple-graph-rs"
version = "0.1.0"
description = "Rust-accelerated global efficiency calculation for the Ripple cascade engine"
requires-python = ">=3.11"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ripple_graph_rs"
