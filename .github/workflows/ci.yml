name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
          pip install flake8
      - name: Run Linting
        run: |
          cd backend
          flake8 app tests
          ruff check .
      - name: Run Type Checking
        run: |
          cd backend
          mypy app
      - name: Run Tests
        run: |
          cd backend
          pytest tests/
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            backend/native/ripple_graph_rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/native/ripple_graph_rs/Cargo.lock') }}
      - name: Run cargo test
        run: |
          cd backend/native/ripple_graph_rs
          cargo test --release
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]"
      - name: Build and install the native extension
        run: |
          pip install maturin
          cd backend/native/ripple_graph_rs
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Run backend tests with the native module built
        run: |
          cd backend
          pytest tests/
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Tests
        run: |
          cd frontend
          npm test
      - name: Run Type Check & Build
        run: |
          cd frontend
          npm run build
